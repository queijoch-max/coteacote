security:
    # ES-01 : algorithme par défaut de Symfony (auto)
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        doc:
            pattern: ^/api/doc
            security: false
        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\ApiAuthenticationHandler
            access_denied_handler: App\Security\ApiAuthenticationHandler
            # ES-02 : session (cookie HttpOnly, SameSite=Lax), voir framework.yaml
            json_login:
                check_path: api_connexion
                username_path: email
                password_path: password
                success_handler: App\Security\ApiAuthenticationHandler
                failure_handler: App\Security\ApiAuthenticationHandler
            # ES-06 : 5 tentatives de connexion par 15 minutes
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: api_deconnexion

    access_control:
        - { path: ^/api/(session|connexion|inscription|confirmer-email|references|doc), roles: PUBLIC_ACCESS }
        - { path: ^/api/mairie, roles: ROLE_MAIRIE }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
